<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل دخول الطاقم الطبي والإداري | صيدلية الشفاء الذكية</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --primary: #059669;
            --primary-dark: #047857;
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border: #334155;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Cairo', sans-serif;
            background: radial-gradient(circle at top right, #064e3b, #0f172a 60%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .login-card {
            background: rgba(30, 41, 59, 0.85);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            width: 100%;
            max-width: 440px;
            padding: 36px 30px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
        }

        .brand-header {
            text-align: center;
            margin-bottom: 28px;
        }

        .logo-box {
            width: 58px;
            height: 58px;
            background: linear-gradient(135deg, var(--primary), #0284c7);
            border-radius: 16px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 1.8rem;
            color: white;
            margin-bottom: 14px;
            box-shadow: 0 8px 20px rgba(5, 150, 105, 0.4);
        }

        .brand-header h1 {
            font-size: 1.45rem;
            font-weight: 800;
            margin-bottom: 4px;
        }

        .brand-header p {
            color: var(--text-muted);
            font-size: 0.88rem;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            font-size: 0.88rem;
            font-weight: 700;
            margin-bottom: 6px;
            color: var(--text-main);
        }

        .input-wrap {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-wrap i {
            position: absolute;
            right: 14px;
            color: var(--text-muted);
            font-size: 1rem;
        }

        .form-control {
            width: 100%;
            padding: 12px 42px 12px 14px;
            background: #0f172a;
            border: 1px solid var(--border);
            border-radius: 12px;
            color: white;
            font-family: inherit;
            font-size: 0.95rem;
            outline: none;
            transition: all 0.2s;
        }

        .form-control:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(5, 150, 105, 0.3);
        }

        .submit-btn {
            width: 100%;
            padding: 13px;
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: white;
            border: none;
            border-radius: 12px;
            font-family: inherit;
            font-size: 1rem;
            font-weight: 800;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            box-shadow: 0 8px 18px rgba(5, 150, 105, 0.35);
            transition: all 0.2s;
            margin-top: 10px;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 22px rgba(5, 150, 105, 0.45);
        }

        .role-selector-box {
            margin-top: 24px;
            padding-top: 20px;
            border-top: 1px dashed var(--border);
            text-align: center;
        }

        .role-selector-title {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-bottom: 10px;
        }

        .quick-role-buttons {
            display: flex;
            gap: 10px;
        }

        .role-btn {
            flex: 1;
            padding: 8px 10px;
            border-radius: 10px;
            border: 1px solid var(--border);
            background: #0f172a;
            color: var(--text-main);
            font-family: inherit;
            font-size: 0.82rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
        }

        .role-btn:hover {
            border-color: var(--primary);
            background: rgba(5, 150, 105, 0.15);
        }

        .alert-box {
            padding: 10px 14px;
            border-radius: 10px;
            font-size: 0.85rem;
            margin-bottom: 16px;
            display: none;
        }

        .alert-danger {
            background: rgba(239, 68, 68, 0.2);
            border: 1px solid #ef4444;
            color: #fca5a5;
        }

        .alert-success {
            background: rgba(16, 185, 129, 0.2);
            border: 1px solid #10b981;
            color: #6ee7b7;
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 18px;
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.85rem;
            transition: color 0.2s;
        }

        .back-link:hover {
            color: var(--primary);
        }
    </style>
</head>
<body>

    <div class="login-card">
        <div class="brand-header">
            <div class="logo-box">
                <i class="fa-solid fa-staff-snake"></i>
            </div>
            <h1>صيدلية الشفاء الذكية</h1>
            <p>بوابة تسجيل دخول الطاقم الطبي والإدارة</p>
        </div>

        <div id="alertBox" class="alert-box"></div>

        <form id="loginForm" onsubmit="handleLogin(event)">
            <div class="form-group">
                <label for="username">اسم المستخدم:</label>
                <div class="input-wrap">
                    <i class="fa-solid fa-user"></i>
                    <input type="text" id="username" class="form-control" placeholder="admin أو pharmacist" required autofocus>
                </div>
            </div>

            <div class="form-group">
                <label for="password">كلمة المرور المشفرة:</label>
                <div class="input-wrap">
                    <i class="fa-solid fa-lock"></i>
                    <input type="password" id="password" class="form-control" placeholder="••••••••" required>
                </div>
            </div>

            <button type="submit" id="submitBtn" class="submit-btn">
                <i class="fa-solid fa-arrow-right-to-bracket"></i>
                <span>تسجيل الدخول للنظام</span>
            </button>
        </form>

        <!-- Quick Credentials Helper -->
        <div class="role-selector-box">
            <div class="role-selector-title">بيانات الدخول السريع لاختبار الصلاحيات:</div>
            <div class="quick-role-buttons">
                <button type="button" class="role-btn" onclick="fillCredentials('admin', 'AdminPassword@2026')">
                    <i class="fa-solid fa-user-shield" style="color: #38bdf8;"></i> المدير العام
                </button>
                <button type="button" class="role-btn" onclick="fillCredentials('pharmacist', 'Pharmacist@2026')">
                    <i class="fa-solid fa-user-doctor" style="color: #34d399;"></i> الصيدلي المناوب
                </button>
            </div>
        </div>

        <a href="/" class="back-link">
            <i class="fa-solid fa-house"></i> العودة للموقع الرئيسي للصيدلية
        </a>
    </div>

    <script>
        function fillCredentials(u, p) {
            document.getElementById('username').value = u;
            document.getElementById('password').value = p;
        }

        async function handleLogin(e) {
            e.preventDefault();
            const alertBox = document.getElementById('alertBox');
            const submitBtn = document.getElementById('submitBtn');
            const u = document.getElementById('username').value.trim();
            const p = document.getElementById('password').value.trim();

            submitBtn.disabled = true;
            submitBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> جاري التحقق الآمن...';

            try {
                const res = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: u, password: p })
                });

                const data = await res.json();

                if (res.ok) {
                    alertBox.className = 'alert-box alert-success';
                    alertBox.innerHTML = `<i class="fa-solid fa-circle-check"></i> ${data.message} - جاري التحويل...`;
                    alertBox.style.display = 'block';

                    setTimeout(() => {
                        window.location.href = '/admin';
                    }, 800);
                } else {
                    alertBox.className = 'alert-box alert-danger';
                    alertBox.innerHTML = `<i class="fa-solid fa-triangle-exclamation"></i> ${data.message || 'بيانات الدخول غير صحيحة'}`;
                    alertBox.style.display = 'block';
                    submitBtn.disabled = false;
                    submitBtn.innerHTML = '<i class="fa-solid fa-arrow-right-to-bracket"></i> تسجيل الدخول للنظام';
                }
            } catch (err) {
                alertBox.className = 'alert-box alert-danger';
                alertBox.innerHTML = `<i class="fa-solid fa-circle-xmark"></i> تعذر الاتصال بالخادم. يرجى المحاولة لاحقاً.`;
                alertBox.style.display = 'block';
                submitBtn.disabled = false;
                submitBtn.innerHTML = '<i class="fa-solid fa-arrow-right-to-bracket"></i> تسجيل الدخول للنظام';
            }
        }
    </script>
</body>
</html>
